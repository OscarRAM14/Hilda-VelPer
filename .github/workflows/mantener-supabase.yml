# Hilda VelPer · evita que Supabase (plan gratis) pause la base de datos.
# Cada 3 días hace una consulta pequeña al catálogo. No cambia ningún dato.
name: Mantener Supabase activo
on:
  schedule:
    - cron: '17 15 */3 * *'   # cada 3 días, 9:17 am hora de México
  workflow_dispatch:          # botón "Run workflow" para probarlo a mano
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Consultar el catálogo
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" \
            "https://hdwrcsozpimmxtjzzqug.supabase.co/rest/v1/negocio?select=nombre" \
            -H "apikey: sb_publishable_pmj8WgIdTPKmGMM-hPREqA_7lODhnBL")
          echo "Respuesta de Supabase: $code"
          test "$code" = "200"
